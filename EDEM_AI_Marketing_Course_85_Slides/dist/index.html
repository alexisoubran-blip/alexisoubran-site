<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />

  </head>
  <body>
    <a class="skip-link" href="#deck">Saltar a la presentación</a>
    <div class="app-shell">
      <header class="topbar" aria-label="Controles de presentación">
        <button class="brand-lockup" data-jump="0" aria-label="Volver al inicio">
          <span class="brand-shield" aria-hidden="true">E</span>
          <span>EDEM</span>

        <div class="course-label">IA PARA LÍDERES DE MARKETING · 2026</div>

        <div class="toolbox-head">
          <div>
            <span class="kicker">BONUS · ACTUALIZABLE</span>
            <h2>ARSENAL 2026</h2>
          </div>
          <button data-action="close-toolbox" aria-label="Cerrar arsenal">×</button>
        </div>
        <div class="toolbox-body" id="toolbox-content"></div>
      </aside>

      <div class="toast" role="status" aria-live="polite"></div>
